name: Actualizar Feed RSS

on:
  schedule:
    # Se ejecuta automáticamente cada 48 horas (cada 2 días a las 00:00 UTC)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Generar Feed RSS
      run: python generate_rss.py

    - name: Hacer Commit y Push del feed.xml
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git commit -m "bot: Actualización del feed RSS" || exit 0
        git push
